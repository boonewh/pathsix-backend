name: CI
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CRM_RLS_ENABLED: '1'
      SECURITY_TEST_ROLE: crm_test_runtime
      SECRET_KEY: ci-test-only-key
      DATABASE_URL: postgresql://crm_test:test-only@localhost:5432/crm_test
      SECURITY_TEST_DATABASE_URL: postgresql://crm_test:test-only@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m compileall -q app
      - name: Create restricted test role
        run: |
          python - <<'PY'
          import os, psycopg2
          with psycopg2.connect(os.environ['DATABASE_URL']) as connection:
              with connection.cursor() as cursor:
                  cursor.execute('CREATE ROLE crm_test_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS')
          PY
      - run: python -m pytest -q
