name: CI

# Insurance gate for the backend. Starts as a dependency-free syntax/compile
# check; Phase 4 adds `pip install -r requirements.txt` + `pytest` (incl. the
# tenant-isolation regression tests).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax / compile check
        run: python -m compileall app
      # Phase 4 (add tests):
      # - run: pip install -r requirements.txt
      # - run: pytest

  purge-regression:
    name: Purge and production recovery regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-test-only-key
      SENTRY_DSN: ''
      DATABASE_URL: postgresql://crm_test:test-only@localhost:5432/crm_test
      PURGE_TEST_DATABASE_URL: postgresql://crm_test:test-only@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_purge_ux.py tests/test_read_recovery.py tests/test_auth_sentry_diagnostics.py tests/test_sales_activity.py --tb=short
