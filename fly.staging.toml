# Staging config — mirrors prod (fly.toml) with the staging app name.
# Deploy with: flyctl deploy --app pathsixsolutions-backend-staging --config fly.staging.toml
# Phase 2 hardening (health check, keep-alive removal) gets tested HERE before prod.

app = "pathsixsolutions-backend-staging"
primary_region = "iad"

[build]

[processes]
  app = "hypercorn asgi:app --bind 0.0.0.0:8000 --keep-alive 600"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"    # staging sleeps when idle, auto-wakes on request (cheap)
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Deploy health gate — same as prod, validated here first.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

  # Extended timeout for long-running backup/restore operations
  [http_service.http_options]
    response_timeout = "10m"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
