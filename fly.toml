# fly.toml app configuration file generated for pathsixsolutions-backend on 2025-12-08T02:30:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "pathsixsolutions-backend"
primary_region = "ord"   # co-located with the prod DB (pathsixsolutions-db) in ORD

[build]

[processes]
  app = "hypercorn asgi:app --bind 0.0.0.0:8000 --keep-alive 600"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # always-on: never stop the single prod machine (no traffic cold-starts)
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Deploy health gate: Fly won't route traffic to a machine until /api/health passes.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

  # Extended timeout for long-running backup/restore operations
  [http_service.http_options]
    response_timeout = "10m"  # 10 minutes for backup/restore endpoints

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
