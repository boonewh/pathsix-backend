# Mobile config — the separate development backend for the mobile app's work.
# Deploy with: flyctl deploy --app pathsixsolutions-backend-mobile --config fly.mobile.toml
#
# This environment exists so mobile schema work never sits on staging, because a
# production hotfix is cut from staging and would have to carry it along. Nothing
# here is a release candidate: it is wiped and reseeded freely.

app = "pathsixsolutions-backend-mobile"
primary_region = "iad"   # co-located with pathsixsolutions-db-mobile

[build]

[env]
  # Same row-security posture as production: the app runs as the restricted
  # pathsix_crm_mobile_runtime login and sets each request's tenant and user.
  # Mobile migrations add columns and tables, and their grants have to fail here
  # rather than after a merge.
  CRM_RLS_ENABLED = "1"
  # Label the OAuth browser pages as a non-production account environment.
  OAUTH_STAGING = "true"
  # The AI connector is deliberately absent. With no MCP_RESOURCE_URI the
  # connector answers 503, so this box cannot be mistaken for one that serves it.

[processes]
  app = "hypercorn asgi:app --bind 0.0.0.0:8000 --keep-alive 600"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle
  auto_start_machines = true
  min_machines_running = 0      # nothing here needs catching; it may sleep fully
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

  [http_service.http_options]
    response_timeout = "10m"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
